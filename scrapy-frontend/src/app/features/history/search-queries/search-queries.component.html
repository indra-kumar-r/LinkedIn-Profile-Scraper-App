<div class="search-queries-wrapper">
  <div class="sidebar">
    <app-sidebar></app-sidebar>
  </div>

  <div class="search-queries-container">
    <div class="header-section">
      <div class="text-secondary fw-bold text-uppercase">Search Queries</div>
    </div>

    <ng-container *ngIf="!loadingSearchQueries; else loaderContainer">
      <ng-container *ngIf="totalResults > 0; else emptyResultsContainer">
        <div class="search-queries-section">
          <div class="search-queries-headers-section fw-bold fs-6 text-dark">
            {{ totalResults }} results
          </div>

          <div class="search-queries-details-section">
            <div
              class="search-query"
              *ngFor="let query of searchResults"
              (click)="viewSearchResults(query.searchId)"
            >
              <div class="query-content-section header-content-section">
                <div class="query-content fw-bold text-dark">
                  {{ query.query }}
                </div>

                <div class="options-section">
                  <div class="option-btn">
                    <i class="bi bi-arrow-right-circle fs-5"></i>
                  </div>

                  <div
                    class="option-btn"
                    (click)="
                      $event.stopPropagation(); copySearchQuery(query.query)
                    "
                  >
                    <i class="bi bi-copy fs-5"></i>
                  </div>
                </div>
              </div>

              <div class="query-content-section fw-bold">
                <div class="query-contentx">
                  {{ query.createdAt | date }}
                </div>

                <div class="query-content">
                  Search count: {{ query.searchCount }}
                </div>
              </div>
            </div>
          </div>
        </div>

        <ng-container *ngIf="totalPages > 1">
          <div class="pagination-container">
            <button
              class="btn btn-dark"
              [disabled]="page <= 1"
              (click)="prevPage()"
            >
              Previous
            </button>

            <div class="input-section">
              <span>Page</span>

              <input
                type="number"
                [formControl]="pageControl"
                [min]="1"
                [max]="totalPages || null"
              />

              <span>of {{ totalPages }}</span>
            </div>

            <button
              class="btn btn-dark"
              [disabled]="totalPages && page >= totalPages"
              (click)="nextPage()"
            >
              Next
            </button>
          </div>
        </ng-container>
      </ng-container>

      <ng-template #emptyResultsContainer>
        <div class="empty-results-section">
          <img src="logo.png" alt="Logo" />

          <div class="info text-secondary fw-bold fs-6 text-uppercase">
            No search queries found!
          </div>

          <button class="btn btn-dark" (click)="navigateToSearch()">
            New search
          </button>
        </div>
      </ng-template>
    </ng-container>

    <ng-template #loaderContainer>
      <div class="loader-wrapper">
        <div class="spinner-border" role="status"></div>
      </div>
    </ng-template>
  </div>
</div>
