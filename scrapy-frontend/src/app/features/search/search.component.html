<div class="search-wrapper">
  <div class="sidebar">
    <app-sidebar></app-sidebar>
  </div>

  <div class="search-container">
    <ng-container *ngIf="!searchId; else searchContainer">
      <div class="search-section">
        <div class="image-section">
          <img src="logo.png" alt="Search" />
        </div>

        <div class="fs-2">
          Search <span class="fw-bold"> Linkedin profiles </span> using
          <span class="fw-bold"> boolean search! </span>
        </div>

        <form
          [formGroup]="searchForm"
          (ngSubmit)="onSubmit()"
          class="input-form"
        >
          <input
            formControlName="query"
            placeholder="Enter the boolean search"
            autocomplete="off"
            required
          />

          <div class="form-options">
            <button
              type="submit"
              class="btn btn-dark"
              [disabled]="searchForm.invalid"
            >
              <i class="bi bi-search fw-bold fs-6"></i>
            </button>
          </div>
        </form>

        <div class="helper-section" (click)="linkedinHelper()">
          <div class="text-dark fw-bold">
            Check out how to use boolean search on
          </div>

          <div class="text-primary">
            <i class="bi bi-linkedin"></i>
            <span class="fw-bold"> Linkedin </span>
          </div>

          <i class="bi bi-arrow-up-right-circle fs-6 fw-bold"></i>
        </div>
      </div>
    </ng-container>

    <ng-template #searchContainer>
      <div class="search-section">
        <div class="query-section text-secondary" (click)="copySearchQuery()">
          {{ searchForm.get("query")?.value }}

          <i class="bi bi-copy fs-5"></i>
        </div>

        <div class="search-results-section">
          <ng-container *ngIf="searchResults.length > 0 && !loading">
            <div class="export-section">
              <button class="btn btn-dark" (click)="export()">Export</button>
            </div>
          </ng-container>

          <div
            class="results-section"
            [ngClass]="{
              loading: loading,
            }"
          >
            <div class="search-item" *ngFor="let item of this.searchResults">
              <div class="title-section">
                <span class="text-dark fw-bold fs-5">{{ item.title }}</span>

                <div class="item-btns text-dark fw-bold">
                  <div
                    class="item-btn"
                    (click)="viewLinkedinProfile(item.link)"
                  >
                    View Profile <i class="bi bi-link fs-5"></i>
                  </div>

                  <div class="item-btn" (click)="copyLinkedinUrl(item.link)">
                    Copy Link
                    <i class="bi bi-copy fs-6"></i>
                  </div>
                </div>
              </div>

              <div class="link-section text-primary">
                <i class="bi bi-linkedin"></i> {{ item.link }}
              </div>

              <div class="snippet-section">{{ item.snippet }}</div>
            </div>
          </div>

          <ng-container *ngIf="page < 10; else limitInfoContainer">
            <div class="options-section">
              <button
                class="btn btn-dark"
                [disabled]="loading"
                (click)="search()"
              >
                Load more
              </button>

              <ng-container *ngIf="!loading">
                <div class="info-section text-dark fw-bold">
                  Total results: {{ searchResults.length }}
                </div>
              </ng-container>
            </div>
          </ng-container>

          <ng-template #limitInfoContainer>
            <div class="text-secondary fw-bold">
              You have reached the limit!
            </div>
          </ng-template>

          <ng-container *ngIf="loading">
            <div class="loader-wrapper">
              <div class="logo-section">
                <img src="logo.png" alt="Logo" />
              </div>

              <div class="loader-section"></div>
            </div>
          </ng-container>
        </div>
      </div>
    </ng-template>
  </div>
</div>
